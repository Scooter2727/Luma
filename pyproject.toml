[project]
name = "luma-backend"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "networkx>=3.2,<4",
  "shapely>=2.0,<3",
  "httpx>=0.27,<1",
  "tzdata>=2025.1",
  "gtfs-realtime-bindings>=2.0,<3",
]

[tool.vercel]
entrypoint = "backend.app:app"
